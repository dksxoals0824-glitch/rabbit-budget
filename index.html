  :root{
    --bg:#FFF8F2;

    --ink-soft:#9A897E;
    --line:#F0E1D2;

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211915;
      --surface:#2B211C;
      --surface-soft:#332723;
      --ink:#F5E9E0;
      --ink-soft:#C2AFA3;
      --line:#3E312A;
      --pink:#FF9CB4;
      --pink-soft:#4A2A34;
      --periwinkle:#A6ABEF;

      --oat-soft:#4A3B26;

      --danger:#FF8FA3;
      --sky:#8FD2EE;
      --yellow:#F2CE72;
      --shadow:rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#211915;
    --surface:#2B211C;
    --surface-soft:#332723;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;

    font-family:"Jua","Noto Sans KR",system-ui,sans-serif;
    font-weight:400;
    text-wrap:balance;

  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::selection{background:var(--pink-soft);}

    position:absolute; border-radius:50%;
    opacity:.35; filter:blur(2px);
  }
  .flying-bunny{
    position:absolute; left:0; top:0; width:40px; opacity:0;
    will-change:transform, opacity;
  }
  .flying-bunny svg{display:block; width:100%; height:auto;}
  @keyframes flyA{
    0%{transform:translate(-15vw,88vh) rotate(-6deg); opacity:0;}
    8%{opacity:.55;}
    50%{transform:translate(55vw,28vh) rotate(4deg);}
    92%{opacity:.55;}
    100%{transform:translate(120vw,-12vh) rotate(-6deg); opacity:0;}
  }
  @keyframes flyB{
    0%{transform:translate(92vw,102vh) rotate(8deg); opacity:0;}
    8%{opacity:.5;}
    50%{transform:translate(40vw,48vh) rotate(-3deg);}
    92%{opacity:.5;}
    100%{transform:translate(-12vw,-10vh) rotate(8deg); opacity:0;}
  }
  @keyframes flyC{
    0%{transform:translate(-12vw,72vh) rotate(-4deg); opacity:0;}
    8%{opacity:.45;}
    50%{transform:translate(50vw,62vh) rotate(2deg);}
    92%{opacity:.45;}
    100%{transform:translate(116vw,52vh) rotate(-4deg); opacity:0;}
  }
  @keyframes flyD{
    0%{transform:translate(106vw,14vh) rotate(6deg); opacity:0;}
    8%{opacity:.45;}
    50%{transform:translate(45vw,4vh) rotate(-4deg);}
    92%{opacity:.45;}
    100%{transform:translate(-15vw,-6vh) rotate(6deg); opacity:0;}
  }
  .fb1{animation:flyA 27s linear infinite; animation-delay:-3s; width:44px; color:var(--oat);}
  .fb2{animation:flyB 33s linear infinite; animation-delay:-14s; width:34px; color:var(--periwinkle);}
  .fb3{animation:flyC 23s linear infinite; animation-delay:-9s; width:28px; color:var(--pink);}
  .fb4{animation:flyD 30s linear infinite; animation-delay:-19s; width:36px; color:var(--oat);}
  .fb5{animation:flyB 24s linear infinite; animation-delay:-6s; width:26px; color:var(--periwinkle);}
  .fb6{animation:flyA 36s linear infinite; animation-delay:-24s; width:30px; color:var(--pink);}

  /* ---------- gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    padding:24px;
  }
  .gate-card{
    position:relative; z-index:1;
    width:100%; max-width:340px;
    background:var(--surface);
    border-radius:28px;
    padding:36px 28px 32px;
    box-shadow:0 20px 50px var(--shadow);
    text-align:center;
  }
  .gate-card h1{
    font-size:26px; margin:14px 0 4px; color:var(--ink);
  }
  .gate-card p{
    margin:0 0 22px; color:var(--ink-soft); font-size:14px; line-height:1.6;
  }
  .gate-form{display:flex; flex-direction:column; gap:10px;}
  #pw{
    width:100%; padding:14px 16px; border-radius:16px;
    border:2px solid var(--line); background:var(--surface-soft);
    color:var(--ink); font-size:18px; text-align:center;
    letter-spacing:4px; outline:none;
  }
  #pw:focus{border-color:var(--pink);}
  .gate-btn{
    width:100%; padding:14px; border:none; border-radius:16px;
    background:var(--pink); color:#fff; font-size:16px; font-weight:700;
    cursor:pointer; transition:transform .15s ease, opacity .15s ease;
  }
  .gate-btn:active{transform:scale(0.97);}
  .gate-error{
    min-height:18px; color:var(--danger); font-size:13px; margin-top:2px;
  }

  /* ---------- app shell ---------- */
  #app{
    position:relative; z-index:1;
    max-width:520px; margin:0 auto;
    padding:max(20px, env(safe-area-inset-top, 20px)) 16px 100px;
  }
  header.top{
    display:flex; align-items:center; gap:8px;
    padding:6px 4px 18px;
  }
  header.top .titles{flex:0 1 auto; min-width:0;}
  header.top h1{font-size:22px; margin:0; line-height:1.15; white-space:nowrap;}
  header.top .sub{font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap;}
  /* tagline sits on the SAME row as the title, to the right. Its font-size
     is set at runtime by JS (fitHeaderNote) so it always shrinks to whatever
     room is actually left after the icon+title — it can never overlap them
     or run off screen, on any device/font. */
  header.top .header-note{
    position:relative; overflow:visible;
    flex:1 1 auto; min-width:0; margin-left:auto; padding-left:6px;
    text-align:right; font-family:'Jua',sans-serif; font-weight:400;
    font-size:13.5px; line-height:1.4; color:var(--periwinkle); opacity:0.95;
  }
  header.top .header-note div{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-note .mini-heart{
    position:absolute; top:-6px; font-size:10px; line-height:1; opacity:0;
    animation:heartPop 2.6s ease-in infinite; pointer-events:none;
  }
  .header-note .mini-heart.hn1{left:6%;  color:var(--pink);       font-size:9px;  animation-delay:0.2s;}
  .header-note .mini-heart.hn2{left:32%; color:var(--periwinkle); font-size:8px;  animation-delay:1.1s;}
  .header-note .mini-heart.hn3{left:58%; color:var(--pink);       font-size:10px; animation-delay:1.9s;}
  .header-note .mini-heart.hn4{left:84%; color:var(--periwinkle); font-size:8.5px; animation-delay:0.7s;}

  /* family icon: mom + dad hugging baby bunny, hearts popping above */
  .family-icon{
    position:relative; width:60px; height:52px; flex:none; overflow:visible;
  }
  .family-icon svg{width:100%; height:100%; display:block;}
  .mini-heart{
    position:absolute; top:-4px; font-size:11px; line-height:1; opacity:0;
    animation:heartPop 2.6s ease-in infinite;
  }
  .mini-heart.h1{left:2px; color:var(--pink); animation-delay:0s;}
  .mini-heart.h2{left:22px; font-size:8px; color:var(--periwinkle); animation-delay:0.9s;}
  .mini-heart.h3{left:40px; font-size:10px; color:var(--pink); animation-delay:1.8s;}
  @keyframes heartPop{
    0%{transform:translateY(6px) scale(0.3); opacity:0;}
    14%{transform:translateY(-2px) scale(1); opacity:1;}
    55%{transform:translateY(-20px) scale(1.05); opacity:.85;}
    100%{transform:translateY(-32px) scale(0.7); opacity:0;}
  }

  .month-nav{
    display:flex; align-items:center;
    gap:10px; margin:0 0 10px;
  }
  .month-nav-controls{
    display:flex; align-items:center; gap:6px; flex:none;
  }
  .month-nav button{
    width:27px; height:27px; border-radius:50%; border:none;
    background:var(--surface); box-shadow:0 3px 10px var(--shadow);
    color:var(--ink); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:active{transform:scale(0.92);}
  .month-nav .label{font-size:14.5px; font-weight:700; min-width:68px; text-align:center;}

  .date-filter-chip{
    display:none; align-items:center; justify-content:center; gap:8px;
    margin:0 0 14px; font-size:12.5px; color:var(--ink-soft);
  }
  .date-filter-chip.show{display:flex;}
  .date-filter-chip strong{color:var(--ink);}
  .date-filter-chip button{
    border:none; background:var(--surface-soft); color:var(--ink);
    padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer;
    box-shadow:0 2px 6px var(--shadow);
  }

  /* stat tiles */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;
  }
  .stat-tile{
    background:var(--surface); border-radius:16px; padding:12px 8px;
    box-shadow:0 3px 10px var(--shadow);
    text-align:center; cursor:pointer; border:2px solid transparent;
  }
  .stat-tile.active{border-color:var(--tile-accent, var(--pink));}
  .stat-tile .dot{
    width:8px; height:8px; border-radius:50%; margin:0 auto 6px;
    background:var(--tile-accent, var(--pink));
  }
  .stat-tile .lbl{font-size:10.5px; color:var(--ink-soft); margin-bottom:3px; line-height:1.35;}
  .stat-tile .amt{font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums;}

  .total-bar{
    background:var(--surface); border-radius:18px; padding:16px 18px;
    box-shadow:0 3px 10px var(--shadow); margin-bottom:16px;
  }
  .total-bar .row{display:flex; align-items:baseline; justify-content:space-between;}
  .total-bar .row .lbl{font-size:13px; color:var(--ink-soft);}
  .total-bar .row .amt{font-size:24px; font-weight:900; font-variant-numeric:tabular-nums;}
  .split{
    display:flex; height:8px; border-radius:6px; overflow:hidden; margin-top:10px;
    background:var(--line);
  }
  .split span{height:100%;}

  /* category tabs — choose which add-screen shows */
  .cat-tabs{
    display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;
  }
  .cat-tabs button{
    flex:none; padding:9px 14px; border-radius:999px; border:none;
    background:var(--surface); color:var(--ink-soft); font-size:13px; font-weight:700;
    cursor:pointer; box-shadow:0 2px 6px var(--shadow);
  }
  .cat-tabs button.active{background:var(--tab-accent,var(--pink)); color:#fff;}

  /* single dynamic add-card */
  #addCard{
    background:var(--surface); border-radius:22px; padding:18px;
    box-shadow:0 4px 14px var(--shadow); margin-bottom:22px;
  }
  #addCard h2{
    font-size:15px; margin:0 0 12px; color:var(--ink);
    font-family:"Noto Sans KR"; font-weight:700;
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  #addCard h2 .hint{font-size:11px; font-weight:500; color:var(--ink-soft);}

  /* warning flag — sits quietly in the month-nav row, to the right of the
     month controls, and just flutters in place. Never floats over the
     input fields, never moves position, so it stays out of the way. */
  .warn-flag{
    display:flex; align-items:center; flex:none; perspective:260px;
    margin-left:auto;
  }
  .warn-flag[hidden]{display:none;}
  .flag-bunny{
    position:relative; flex:none; width:29px; height:26px; z-index:2; margin-right:-9px;
  }
  .flag-bunny svg{display:block; width:100%; height:100%; overflow:visible;}
  .flag-paper{
    position:relative; flex:none; width:140px; height:37px; margin-left:8px;
    background:var(--balloon-color, var(--sky));
    border-radius:4px 10px 10px 4px;
    box-shadow:0 3px 9px var(--shadow);
    transform-origin:0% 50%;
    animation:flagFlutter 2.4s ease-in-out infinite;
  }
  .flag-paper.pulse{
    animation:flagPulse 0.5s ease-out,
              flagFlutter 2.4s ease-in-out 0.5s infinite;
  }
  .flag-text{
    position:absolute; inset:0; padding:2px 5px 2px 8px;
    display:flex; align-items:center; justify-content:center;
    white-space:nowrap;
    color:#fff; font-family:"Jua","Noto Sans KR",sans-serif; font-weight:400;
    font-size:11.5px; line-height:1;
    text-shadow:0 1px 2px rgba(0,0,0,0.25);
  }
  @keyframes flagFlutter{
    0%{transform:rotateY(0deg) skewY(0deg);}
    25%{transform:rotateY(-10deg) skewY(-1.5deg);}
    50%{transform:rotateY(0deg) skewY(0deg);}
    75%{transform:rotateY(8deg) skewY(1.5deg);}
    100%{transform:rotateY(0deg) skewY(0deg);}
  }
  @keyframes flagPulse{
    0%{transform:scale(0.7); opacity:0;}
    60%{transform:scale(1.1); opacity:1;}
    100%{transform:scale(1); opacity:1;}
  }
  @media (min-width:400px){
    .flag-bunny{width:34px; height:30px; margin-right:-11px;}
    .flag-paper{width:148px; height:40px; margin-left:9px;}
    .flag-text{font-size:12px; padding:2px 6px 2px 9px;}
  }
  @media (max-width:345px){
    .month-nav-controls{gap:4px;}
    .month-nav button{width:24px; height:24px; font-size:12.5px;}
    .month-nav .label{font-size:13px; min-width:58px;}
    .flag-bunny{width:25px; height:23px; margin-right:-8px;}
    .flag-paper{width:120px; height:34px; margin-left:7px;}
    .flag-text{font-size:10px; padding:2px 4px 2px 7px;}
  }

  .field-row{display:flex; gap:8px; margin-bottom:10px;}
  .field{flex:1; display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; color:var(--ink-soft); font-weight:700; padding-left:2px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:12px; border:2px solid var(--line);
    background:var(--surface-soft); color:var(--ink); font-size:14.5px; outline:none;
  }
  .field input:focus{border-color:var(--pink);}
  .submit-btn{
    width:100%; padding:13px; border:none; border-radius:14px;
    background:var(--mint); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    margin-top:2px;
  }
  .submit-btn.secondary{background:var(--periwinkle);}
  .submit-btn:active{transform:scale(0.98);}
  .submit-btn:disabled{opacity:.5; cursor:default;}

  /* fixed items list (inside addCard when 고정지출 tab active) */
  .fixed-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--surface-soft); border-radius:14px; padding:10px 12px; margin-bottom:8px;
  }
  .fixed-row .fr-info{flex:1; min-width:0;}
  .fixed-row .fr-memo{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fixed-row .fr-date{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .fixed-row .fr-amt{font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums; flex:none;}
  .fixed-row .fr-amt-input{
    width:110px; padding:7px 8px; border-radius:10px; border:2px solid var(--oat);
    background:var(--surface); color:var(--ink); font-size:14px; text-align:right; outline:none;
  }
  .fixed-row .fr-btn{
    flex:none; width:28px; height:28px; border-radius:50%; border:none;
    background:transparent; color:var(--ink-soft); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .fixed-row .fr-btn.save{color:var(--mint); font-size:16px; font-weight:700;}
  .fixed-empty{font-size:12.5px; color:var(--ink-soft); padding:4px 2px 12px;}

  /* fixed-row editing mode: memo + date + amount stacked, actions row below */
  .fr-edit-fields{
    flex:1 1 100%; display:flex; flex-direction:column; gap:6px;
  }
  .fr-edit-fields .fr-memo-input{
    width:100%; padding:7px 10px; border-radius:10px; border:2px solid var(--oat);
    background:var(--surface); color:var(--ink); font-size:13.5px; outline:none;
  }
  .fr-edit-row2{display:flex; gap:6px;}
  .fr-edit-row2 .fr-date-input{
    flex:1; min-width:0; padding:7px 8px; border-radius:10px; border:2px solid var(--oat);
    background:var(--surface); color:var(--ink); font-size:12.5px; outline:none;
  }
  .fr-edit-row2 .fr-amt-input{flex:1; width:auto;}
  .fr-edit-actions{flex:1 1 100%; display:flex; gap:8px; justify-content:flex-end;}

  /* entries */
  .day-group{margin-bottom:16px;}
  .day-group .day-label{
    font-size:12px; color:var(--ink-soft); font-weight:700; margin:0 0 8px 4px;
    background:none; border:none; padding:2px 6px 2px 0; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
  }
  .day-group .day-label:hover{color:var(--pink);}
  .day-group .day-label.picked{color:var(--pink);}
  .entry{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface); border-radius:16px; padding:12px 14px;
    box-shadow:0 2px 8px var(--shadow); margin-bottom:8px;
  }
  .entry .chip{
    flex:none; width:6px; align-self:stretch; border-radius:4px;
    background:var(--chip-accent,var(--pink));
  }
  .entry .info{flex:1; min-width:0;}
  .entry .memo{font-size:14px; font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .entry .cat{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .entry .amt{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; flex:none;}
  .entry .del{
    flex:none; width:28px; height:28px; border-radius:50%; border:none;
    background:transparent; color:var(--ink-soft); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .entry .del.confirm{background:var(--danger); color:#fff;}
  .entry .del.save{color:var(--mint); font-size:17px; font-weight:700;}

  /* entry editing mode: memo input full width, amount + actions below */
  .entry-edit-fields{flex:1 1 100%; display:flex; flex-direction:column; gap:4px;}
  .entry-edit-fields .entry-memo-input{
    width:100%; padding:7px 10px; border-radius:10px; border:2px solid var(--oat);
    background:var(--surface-soft); color:var(--ink); font-size:13.5px; outline:none;
  }
  .entry-edit-fields .cat{font-size:11px; color:var(--ink-soft);}
  .entry-edit-actions{flex:1 1 100%; display:flex; align-items:center; gap:8px; justify-content:flex-end;}
  .entry-edit-actions .fr-amt-input{flex:1; width:auto; max-width:160px;}

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
  }
  .empty-state .mascot{width:64px; height:64px; margin:0 auto 12px;}
  .empty-state p{font-size:13.5px; margin:0; line-height:1.6;}

  .banner{
    background:var(--oat-soft); color:var(--ink); border-radius:14px;
    padding:10px 14px; font-size:12.5px; margin-bottom:14px; text-align:center;
    line-height:1.5;
  }
  .sync-btns{display:flex; gap:8px; justify-content:center;}
  .sync-btns button{
    border:none; border-radius:999px; padding:7px 16px; font-size:12px; font-weight:700;
    cursor:pointer; background:var(--pink); color:#fff; box-shadow:0 2px 6px var(--shadow);
  }
  .sync-btns button#importBtn{background:var(--periwinkle);}
  .sync-btns-bottom{margin:26px 0 6px;}

  .sync-modal{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .sync-modal-card{
    position:relative; width:100%; max-width:360px; background:var(--surface);
    border-radius:22px; padding:24px 20px 20px; box-shadow:0 20px 50px var(--shadow);
  }
  .sync-modal-card h3{margin:0 0 8px; font-size:17px;}
  .sync-modal-close{
    position:absolute; top:12px; right:12px; border:none; background:var(--surface-soft);
    color:var(--ink-soft); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:13px;
  }
  .sync-help{font-size:12px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px;}
  .sync-modal-card textarea{
    width:100%; min-height:90px; border-radius:12px; border:2px solid var(--line);
    background:var(--surface-soft); color:var(--ink); font-size:12px; padding:10px;
    resize:vertical; font-family:monospace; margin-bottom:12px; box-sizing:border-box;
  }
  .sync-primary-btn{
    width:100%; padding:12px; border:none; border-radius:14px; background:var(--pink);
    color:#fff; font-weight:700; font-size:14px; cursor:pointer;
  }
  .sync-copied{color:var(--mint); font-size:12.5px; font-weight:700; text-align:center; margin-top:10px;}
  .sync-error{color:var(--danger); font-size:12.5px; font-weight:700; text-align:center; margin-top:10px;}

  [hidden]{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>

<script>
(function(){
  "use strict";

  var PASSWORD = "230115";
  var CATS = {
    fixed:   { label:"고정지출",           accent:"var(--oat)",        soft:"var(--oat-soft)" },
    seol:    { label:"예쁜 공주 설 지출",   accent:"var(--pink)",       soft:"var(--pink-soft)" },
    taemin:  { label:"태민 지출",           accent:"var(--periwinkle)", soft:"var(--periwinkle-soft)" }
  };
  var ALL_CAT_KEYS = ["fixed","seol","taemin"];

  var THRESHOLDS_TOTAL = [
    { min:2000000, text:"아직 괜찮아요..!!!" },
    { min:2500000, text:"아..직.. 괜..찮아..요..!!!" },
    { min:3000000, text:"이..제 절..약해야 해..요..!!!" }
  ];

  var lastWarnTier = 0;
  var warnPending = false;

  function tierRank(total){
    var ascending = THRESHOLDS_TOTAL.slice().sort(function(a,b){ return a.min - b.min; });
    var rank = 0;
    for(var i=0;i<ascending.length;i++){
      if(total >= ascending[i].min) rank = i + 1;
    }
    return rank;
  }

  function resetWarnTracking(){
    lastWarnTier = 0;
    warnPending = false;
  }

  var firebaseConfig = {
    apiKey: "AIzaSyC0oiLJyIDSosK9IlRcDBg2ElwjuG8DNUc",
    authDomain: "rabbit-budget.firebaseapp.com",
    projectId: "rabbit-budget",
    storageBucket: "rabbit-budget.firebasestorage.app",
    messagingSenderId: "714485688227",
    appId: "1:714485688227:web:3d76ca9b9a6301d74b9c16"
  };

  var db = null;
  var localMode = false;
  var localEntries = [];
  var localFixedItems = [];
  var entries = [];
  var fixedItems = [];
  var currentMonth = ymOf(new Date());
  var selectedCat = "all";
  var selectedDate = null;
  var addCardMode = null;
  var editingFixedId = null;
  var editingEntryId = null;

  function ymOf(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fmtWon(n){
    return "₩" + Math.round(n).toLocaleString("ko-KR");
  }
  function monthLabel(ym){
    var parts = ym.split("-");
    return parts[0] + "년 " + parseInt(parts[1],10) + "월";
  }
  function shiftMonth(ym, delta){
    var parts = ym.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1+delta, 1);
    return ymOf(d);
  }
  // ---------- gate ----------
  function tryStoredUnlock(){
    try{
      if(sessionStorage.getItem("rabbit-ledger-unlocked") === "1"){
        showApp();
      }
    }catch(e){ /* storage unavailable, just show gate */ }
  }

  function tryUnlock(){
    var val = document.getElementById("pw").value.trim();
    if(val === PASSWORD){
      try{ sessionStorage.setItem("rabbit-ledger-unlocked","1"); }catch(e){}
      showApp();
    }else{
      document.getElementById("gateError").textContent = "비밀번호가 달라요. 다시 확인해주세요.";
      document.getElementById("pw").value = "";
      document.getElementById("pw").focus();
    }
  }
  document.getElementById("gateSubmitBtn").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(ev){
    if(ev.key === "Enter"){ ev.preventDefault(); tryUnlock(); }
  });

  function showApp(){
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    initApp();
    fitHeaderNote();
  }

  // shrink the header tagline's font-size, in small steps, until both lines
  // fit inside whatever space flexbox actually left it (never overlaps the
  // icon/title, never runs past the screen edge) — re-runs on resize/rotate
  // and once more after the web font finishes loading, since font metrics
  // change the text width.
  function fitHeaderNote(){
    var note = document.querySelector(".header-note");
    if(!note) return;
    var lines = note.querySelectorAll("div");
    if(!lines.length) return;

    var maxSize = 13.5, minSize = 7.5;
    var size = maxSize;
    note.style.fontSize = size + "px";

    function overflowing(){
      var avail = note.clientWidth;
      if(avail <= 0) return false;
      for(var i=0;i<lines.length;i++){
        if(lines[i].scrollWidth > avail + 0.5) return true;
      }
      return false;
    }

    var guard = 0;
    while(overflowing() && size > minSize && guard < 30){
      size -= 0.5;
      note.style.fontSize = size + "px";
      guard++;
    }
  }

  window.addEventListener("resize", function(){
    if(!document.getElementById("app").hidden) fitHeaderNote();
  });
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      if(!document.getElementById("app").hidden) fitHeaderNote();
    });
  }

  // ---------- app init ----------
  var inited = false;
  function initApp(){
    if(inited) return;
    inited = true;

    renderCatTabs();

    document.getElementById("prevMonth").addEventListener("click", function(){
      currentMonth = shiftMonth(currentMonth, -1);
      selectedDate = null;
      resetWarnTracking();
      renderAll();
    });
    document.getElementById("nextMonth").addEventListener("click", function(){
      currentMonth = shiftMonth(currentMonth, 1);
      selectedDate = null;
      resetWarnTracking();
      renderAll();
    });
    document.getElementById("clearDateFilter").addEventListener("click", function(){
      selectedDate = null;
      renderAll();
    });

    try{
      var fbApp = firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      subscribeExpenses();
      subscribeFixedItems();

      // mobile browsers freeze/park background tabs, which can stall the
      // realtime connection silently. force a clean reconnect + re-subscribe
      // whenever the app comes back to the foreground so data is fresh
      // without the person having to manually refresh the page.
      function refreshConnection(){
        if(localMode || !db) return;
        db.disableNetwork().then(function(){
          return db.enableNetwork();
        }).then(function(){
          subscribeExpenses();
          subscribeFixedItems();
        }).catch(function(){});
      }
      document.addEventListener("visibilitychange", function(){
        if(!document.hidden) refreshConnection();
      });
      window.addEventListener("pageshow", refreshConnection);
      window.addEventListener("online", refreshConnection);
      window.addEventListener("focus", refreshConnection);
    }catch(e){
      enterLocalMode();
    }
  }

  // ---------- storage: each phone keeps its own copy in localStorage,
  // synced between the two of you manually via the 내보내기/가져오기 codes ----------
  var STORAGE_KEY = "rabbit-ledger-data-v1";

  function loadLocalData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.expenses)) localEntries = parsed.expenses;
      if(parsed && Array.isArray(parsed.fixedItems)) localFixedItems = parsed.fixedItems;
    }catch(e){ /* ignore, start empty */ }
  }

  function saveLocalData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        expenses: localEntries,
        fixedItems: localFixedItems
      }));
    }catch(e){ /* storage unavailable (private browsing etc) — data stays in-memory only */ }
  }

  function enterLocalMode(){
    localMode = true;
    loadLocalData();
    entries = localEntries;
    fixedItems = localFixedItems;
    renderAll();
  }

  var unsubExpenses = null;
  function subscribeExpenses(){
    if(unsubExpenses){ unsubExpenses(); unsubExpenses = null; }
    var col = db.collection("expenses");
    unsubExpenses = col.onSnapshot(function(snap){
      var list = [];
      snap.docs.forEach(function(doc){
        var d = doc.data();
        if(!d) return;
        list.push({
          id: doc.id,
          category: d.category,
          amount: Number(d.amount) || 0,
          memo: d.memo || "",
          date: d.date || "",
          createdAt: d.createdAt || "",
          updatedAt: d.updatedAt || d.createdAt || ""
        });
      });
      entries = list;
      renderAll();
    }, function(err){
      if(!localMode) enterLocalMode();
    });
  }

  var unsubFixedItems = null;
  function subscribeFixedItems(){
    if(unsubFixedItems){ unsubFixedItems(); unsubFixedItems = null; }
    var col = db.collection("fixedItems");
    unsubFixedItems = col.onSnapshot(function(snap){
      var list = [];
      snap.docs.forEach(function(doc){
        var d = doc.data();
        if(!d) return;
        list.push({
          id: doc.id,
          memo: d.memo || "",
          date: d.date || "",
          amount: Number(d.amount) || 0,
          createdAt: d.createdAt || "",
          updatedAt: d.updatedAt || d.createdAt || ""
        });
      });
      list.sort(function(a,b){ return (a.createdAt || "").localeCompare(b.createdAt || ""); });
      fixedItems = list;
      renderAll();
    }, function(err){
      if(!localMode) enterLocalMode();
    });
  }

  // ---------- category tabs (choose which add-screen shows) ----------
  function renderCatTabs(){
    var wrap = document.getElementById("catTabs");
    wrap.innerHTML = "";
    var allBtn = document.createElement("button");
    allBtn.textContent = "전체";
    if(selectedCat === "all") allBtn.classList.add("active");
    allBtn.style.setProperty("--tab-accent","var(--ink)");
    allBtn.addEventListener("click", function(){ selectedCat = "all"; renderAll(); });
    wrap.appendChild(allBtn);

    ALL_CAT_KEYS.forEach(function(key){
      var c = CATS[key];
      var btn = document.createElement("button");
      btn.textContent = c.label;
      btn.style.setProperty("--tab-accent", c.accent);
      if(selectedCat === key) btn.classList.add("active");
      btn.addEventListener("click", function(){ selectedCat = key; renderAll(); });
      wrap.appendChild(btn);
    });
  }

  // ---------- add-card: rebuilt only when the selected category changes ----------
  function ensureAddCard(){
    if(addCardMode === selectedCat) return;
    addCardMode = selectedCat;
    buildAddCard(selectedCat);
  }

  function buildAddCard(cat){
    var card = document.getElementById("addCard");

    if(cat === "all"){
      card.hidden = true;
      card.innerHTML = "";
      return;
    }
    card.hidden = false;

    if(cat === "fixed"){
      card.innerHTML =
        '<h2>고정지출 등록 <span class="hint">한 번 등록하면 매달 자동으로 더해져요</span></h2>' +
        '<div id="fixedListRows"></div>' +
        '<div id="fixedAddForm">' +
          '<div class="field" style="margin-bottom:10px;">' +
            '<label for="fixedMemoInput">항목명</label>' +
            '<input id="fixedMemoInput" type="text" placeholder="예: 월세, 관리비, 보험료" maxlength="40" required></div>' +
          '<div class="field-row">' +
            '<div class="field"><label for="fixedDateInput">날짜</label>' +
            '<input id="fixedDateInput" type="date"></div>' +
            '<div class="field"><label for="fixedAmountInput">금액</label>' +
            '<input id="fixedAmountInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0" required></div>' +
          '</div>' +
          '<button type="button" class="submit-btn secondary" id="fixedSubmitBtn">고정지출로 등록</button>' +
        '</div>';
      document.getElementById("fixedDateInput").value = todayStr();
      document.getElementById("fixedSubmitBtn").addEventListener("click", onFixedAddSubmit);
      ["fixedMemoInput","fixedDateInput","fixedAmountInput"].forEach(function(fid){
        document.getElementById(fid).addEventListener("keydown", function(ev){
          if(ev.key === "Enter"){ ev.preventDefault(); onFixedAddSubmit(ev); }
        });
      });
      renderFixedList();
      return;
    }

    // seol / taemin
    var c = CATS[cat];
    card.innerHTML =
      '<h2>' + c.label + ' 추가하기</h2>' +
      '<div id="addForm">' +
        '<div class="field-row">' +
          '<div class="field"><label for="amountInput">지출 금액</label>' +
          '<input id="amountInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0" required></div>' +
          '<div class="field"><label for="dateInput">날짜</label>' +
          '<input id="dateInput" type="date" required></div>' +
        '</div>' +
        '<div class="field" style="margin-bottom:12px;">' +
          '<label for="memoInput">지출 용도</label>' +
          '<input id="memoInput" type="text" placeholder="예: 장보기, 외식, 관리비" required maxlength="60">' +
        '</div>' +
        '<button type="button" class="submit-btn" id="submitBtn">추가하기</button>' +
      '</div>';
    var dateInputEl = document.getElementById("dateInput");
    dateInputEl.value = selectedDate || todayStr();
    dateInputEl.addEventListener("change", function(){
      var val = dateInputEl.value;
      if(!val) return;
      selectedDate = val;
      var newMonth = val.slice(0,7);
      if(newMonth !== currentMonth){
        currentMonth = newMonth;
        resetWarnTracking();
      }
      renderAll();
    });
    var addSubmitHandler = function(ev){ onAddSubmit(ev, cat); };
    document.getElementById("submitBtn").addEventListener("click", addSubmitHandler);
    ["amountInput","memoInput"].forEach(function(fid){
      document.getElementById(fid).addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){ ev.preventDefault(); addSubmitHandler(ev); }
      });
    });
  }

  // ---------- add / delete: variable expenses ----------
  function onAddSubmit(ev, cat){
    ev.preventDefault();
    var amountVal = parseFloat(document.getElementById("amountInput").value);
    var memoVal = document.getElementById("memoInput").value.trim();
    var dateVal = document.getElementById("dateInput").value || todayStr();

    if(!amountVal || amountVal <= 0 || !memoVal){
      return;
    }

    var nowIso = new Date().toISOString();
    var payload = {
      category: cat,
      amount: amountVal,
      memo: memoVal,
      date: dateVal,
      createdAt: nowIso,
      updatedAt: nowIso
    };

    var submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;

    function done(){
      var amtEl = document.getElementById("amountInput");
      var memoEl = document.getElementById("memoInput");
      if(amtEl) amtEl.value = "";
      if(memoEl){ memoEl.value = ""; memoEl.focus(); }
      var btn = document.getElementById("submitBtn");
      if(btn) btn.disabled = false;
    }

    if(localMode || !db){
      payload.id = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
      localEntries.push(payload);
      entries = localEntries;
      saveLocalData();
      renderAll();
      done();
      return;
    }

    db.collection("expenses").add(payload).then(function(){
      done();
    }).catch(function(){
      done();
    });
  }

  function deleteEntry(id){
    if(localMode || !db){
      localEntries = localEntries.filter(function(e){ return e.id !== id; });
      entries = localEntries;
      saveLocalData();
      renderAll();
      return;
    }
    db.doc("expenses/" + id).delete().catch(function(){});
  }

  function saveEntryItem(id, newMemo, newAmount){
    if(localMode || !db){
      localEntries = localEntries.map(function(e){
        if(e.id === id){ e.memo = newMemo; e.amount = newAmount; e.updatedAt = new Date().toISOString(); }
        return e;
      });
      entries = localEntries;
      editingEntryId = null;
      saveLocalData();
      renderAll();
      return;
    }
    db.doc("expenses/" + id).update({ memo: newMemo, amount: newAmount, updatedAt: new Date().toISOString() }).then(function(){
      editingEntryId = null;
      renderAll();
    }).catch(function(){});
  }

  // ---------- fixed items (recurring, auto every month) ----------
  function onFixedAddSubmit(ev){
    ev.preventDefault();
    var memoVal = document.getElementById("fixedMemoInput").value.trim();
    var dateVal = document.getElementById("fixedDateInput").value || todayStr();
    var amountVal = parseFloat(document.getElementById("fixedAmountInput").value);
    if(!memoVal || !amountVal || amountVal <= 0) return;

    var fixedNowIso = new Date().toISOString();
    var payload = { memo: memoVal, date: dateVal, amount: amountVal, createdAt: fixedNowIso, updatedAt: fixedNowIso };
    var btn = document.getElementById("fixedSubmitBtn");
    btn.disabled = true;

    function done(){
      var m = document.getElementById("fixedMemoInput");
      var a = document.getElementById("fixedAmountInput");
      if(m) m.value = "";
      if(a) a.value = "";
      var d = document.getElementById("fixedDateInput");
      if(d) d.value = todayStr();
      var b = document.getElementById("fixedSubmitBtn");
      if(b) b.disabled = false;
    }

    if(localMode || !db){
      payload.id = "local-fixed-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
      localFixedItems.push(payload);
      fixedItems = localFixedItems;
      saveLocalData();
      renderAll();
      done();
      return;
    }

    db.collection("fixedItems").add(payload).then(function(){ done(); }).catch(function(){ done(); });
  }

  function saveFixedItem(id, newMemo, newDate, newAmount){
    if(localMode || !db){
      localFixedItems = localFixedItems.map(function(it){
        if(it.id === id){
          it.memo = newMemo;
          it.date = newDate;
          it.amount = newAmount;
          it.updatedAt = new Date().toISOString();
        }
        return it;
      });
      fixedItems = localFixedItems;
      editingFixedId = null;
      saveLocalData();
      renderAll();
      return;
    }
    db.doc("fixedItems/" + id).update({
      memo: newMemo, date: newDate, amount: newAmount, updatedAt: new Date().toISOString()
    }).then(function(){
      editingFixedId = null;
      renderAll();
    }).catch(function(){});
  }

  function deleteFixedItem(id){
    if(localMode || !db){
      localFixedItems = localFixedItems.filter(function(it){ return it.id !== id; });
      fixedItems = localFixedItems;
      saveLocalData();
      renderAll();
      return;
    }
    db.doc("fixedItems/" + id).delete().catch(function(){});
  }

  function fmtShortDate(dateStr){
    if(!dateStr) return "";
    var parts = dateStr.split("-");
    if(parts.length !== 3) return "";
    return parseInt(parts[1],10) + "월 " + parseInt(parts[2],10) + "일";
  }

  function renderFixedList(){
    var wrap = document.getElementById("fixedListRows");
    if(!wrap) return;
    wrap.innerHTML = "";

    if(fixedItems.length === 0){
      var empty = document.createElement("div");
      empty.className = "fixed-empty";
      empty.textContent = "아직 등록된 고정지출이 없어요. 아래에서 첫 항목을 등록해보세요.";
      wrap.appendChild(empty);
      return;
    }

    fixedItems.forEach(function(item){
      var row = document.createElement("div");
      row.className = "fixed-row";

      if(editingFixedId === item.id){
        var editFields = document.createElement("div");
        editFields.className = "fr-edit-fields";

        var memoInput = document.createElement("input");
        memoInput.type = "text";
        memoInput.className = "fr-memo-input";
        memoInput.value = item.memo;
        memoInput.maxLength = 40;
        editFields.appendChild(memoInput);

        var row2 = document.createElement("div");
        row2.className = "fr-edit-row2";

        var dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.className = "fr-date-input";
        dateInput.value = item.date || "";
        row2.appendChild(dateInput);

        var amtInput = document.createElement("input");
        amtInput.type = "number";
        amtInput.className = "fr-amt-input";
        amtInput.value = item.amount;
        amtInput.min = "0";
        row2.appendChild(amtInput);

        editFields.appendChild(row2);
        row.appendChild(editFields);

        var actions = document.createElement("div");
        actions.className = "fr-edit-actions";

        var saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "fr-btn save";
        saveBtn.textContent = "✓";
        function commitFixedEdit(){
          var mv = memoInput.value.trim();
          var av = parseFloat(amtInput.value);
          var dv = dateInput.value || item.date || todayStr();
          if(mv && av && av > 0) saveFixedItem(item.id, mv, dv, av);
        }
        saveBtn.addEventListener("click", commitFixedEdit);
        actions.appendChild(saveBtn);

        [memoInput, amtInput].forEach(function(el){
          el.addEventListener("keydown", function(e){
            if(e.key === "Enter"){ e.preventDefault(); commitFixedEdit(); }
          });
        });

        var cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "fr-btn";
        cancelBtn.textContent = "✕";
        cancelBtn.addEventListener("click", function(){
          editingFixedId = null;
          renderFixedList();
        });
        actions.appendChild(cancelBtn);

        row.appendChild(actions);
      }else{
        var info = document.createElement("div");
        info.className = "fr-info";
        var memoDiv = document.createElement("div");
        memoDiv.className = "fr-memo";
        memoDiv.textContent = item.memo;
        info.appendChild(memoDiv);
        if(item.date){
          var dateDiv = document.createElement("div");
          dateDiv.className = "fr-date";
          dateDiv.textContent = fmtShortDate(item.date);
          info.appendChild(dateDiv);
        }
        row.appendChild(info);

        var amtDiv = document.createElement("div");
        amtDiv.className = "fr-amt";
        amtDiv.textContent = fmtWon(item.amount);
        row.appendChild(amtDiv);

        var editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "fr-btn";
        editBtn.setAttribute("aria-label","항목 수정");
        editBtn.textContent = "✎";
        editBtn.addEventListener("click", function(){
          editingFixedId = item.id;
          renderFixedList();
        });
        row.appendChild(editBtn);

        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "fr-btn";
        delBtn.setAttribute("aria-label","고정지출 삭제");
        delBtn.textContent = "✕";
        var confirming = false;
        var revertTimer = null;
        delBtn.addEventListener("click", function(){
          if(!confirming){
            confirming = true;
            delBtn.style.color = "var(--danger)";
            revertTimer = setTimeout(function(){
              confirming = false;
              delBtn.style.color = "";
            }, 2500);
          }else{
            clearTimeout(revertTimer);
            deleteFixedItem(item.id);
          }
        });
        row.appendChild(delBtn);
      }

      wrap.appendChild(row);
    });
  }

  var TIER_COLORS = ["", "var(--sky)", "var(--yellow)", "var(--pink)"];

  function updateWarnBalloon(totals){
    // combined 설 + 태민 spending only (고정지출 제외), tracked once per month
    var combined = (totals.seol || 0) + (totals.taemin || 0);
    var rank = tierRank(combined);
    if(rank > lastWarnTier) warnPending = true;
    if(rank < lastWarnTier) warnPending = false;
    lastWarnTier = rank;

    var el = document.getElementById("warnBalloon");

    if(rank <= 0){
      el.hidden = true;
      return;
    }

    var ascending = THRESHOLDS_TOTAL.slice().sort(function(a,b){ return a.min - b.min; });
    var tierObj = ascending[rank - 1];
    el.hidden = false;
    el.style.setProperty("--balloon-color", TIER_COLORS[rank]);
    document.getElementById("balloonText").textContent = tierObj.text;

    if(warnPending){
      warnPending = false;
      var paper = el.querySelector(".flag-paper");
      paper.classList.remove("pulse");
      void paper.offsetWidth;
      paper.classList.add("pulse");
    }
  }

  // ---------- render ----------
  function renderAll(){
    document.getElementById("monthLabel").textContent = monthLabel(currentMonth);
    renderCatTabs();
    ensureAddCard();

    var fixedTotal = fixedItems.reduce(function(sum, it){ return sum + it.amount; }, 0);

    var monthEntries = entries.filter(function(e){ return (e.date || "").slice(0,7) === currentMonth; });

    var totals = { fixed: fixedTotal, seol: 0, taemin: 0 };
    monthEntries.forEach(function(e){
      if(totals.hasOwnProperty(e.category) && e.category !== "fixed") totals[e.category] += e.amount;
    });
    var grand = totals.fixed + totals.seol + totals.taemin;

    document.getElementById("grandTotal").textContent = fmtWon(grand);

    if(addCardMode === "fixed") renderFixedList();
    updateWarnBalloon(totals);

    // date filter chip
    var chip = document.getElementById("dateFilterChip");
    if(selectedDate){
      chip.classList.add("show");
      var dd = parseInt(selectedDate.split("-")[2],10);
      document.getElementById("dateFilterLabel").textContent = dd + "일";
    }else{
      chip.classList.remove("show");
    }

    // split bar
    var splitWrap = document.getElementById("splitBar");
    splitWrap.innerHTML = "";
    if(grand > 0){
      ALL_CAT_KEYS.forEach(function(key){
        var pct = totals[key] / grand * 100;
        if(pct <= 0) return;
        var seg = document.createElement("span");
        seg.style.width = pct + "%";
        seg.style.background = CATS[key].accent;
        splitWrap.appendChild(seg);
      });
    }

    // stat tiles
    var statsWrap = document.getElementById("statTiles");
    statsWrap.innerHTML = "";
    ALL_CAT_KEYS.forEach(function(key){
      var c = CATS[key];
      var tile = document.createElement("div");
      tile.className = "stat-tile" + (selectedCat === key ? " active" : "");
      tile.style.setProperty("--tile-accent", c.accent);
      tile.innerHTML = '<div class="dot"></div><div class="lbl">' + c.label + '</div><div class="amt">' + fmtWon(totals[key]) + "</div>";
      tile.addEventListener("click", function(){
        selectedCat = (selectedCat === key) ? "all" : key;
        renderAll();
      });
      statsWrap.appendChild(tile);
    });

    // entries list below — fixed items are managed in the add-card, not listed by day
    var entriesWrap = document.getElementById("entriesWrap");
    entriesWrap.innerHTML = "";

    if(selectedCat === "fixed" && !selectedDate){
      var hint = document.createElement("div");
      hint.className = "empty-state";
      hint.innerHTML = "<p>고정지출은 위 등록 카드에서 확인하고 금액을 수정할 수 있어요.</p>";
      entriesWrap.appendChild(hint);
      return;
    }

    // when a specific date is picked, show every category for that day —
    // otherwise filter the month's list by the selected category tab.
    var filtered = monthEntries.filter(function(e){
      if(e.category === "fixed") return false;
      if(selectedDate){
        return e.date === selectedDate;
      }
      return selectedCat === "all" || e.category === selectedCat;
    });
    filtered.sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || "").localeCompare(a.createdAt || "");
    });

    if(filtered.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<svg class="mascot" viewBox="0 0 120 120">' +
        '<ellipse cx="42" cy="30" rx="12" ry="30" fill="var(--oat-soft)" transform="rotate(-14 42 30)"/>' +
        '<ellipse cx="78" cy="30" rx="12" ry="30" fill="var(--oat-soft)" transform="rotate(14 78 30)"/>' +
        '<circle cx="60" cy="70" r="34" fill="var(--surface-soft)" stroke="var(--oat)" stroke-width="2.5"/>' +
        '<circle cx="49" cy="66" r="4" fill="var(--ink)"/><circle cx="71" cy="66" r="4" fill="var(--ink)"/>' +
        '<path d="M60 74 q-4 6 -4 8 q4 3 8 0 q0 -2 -4 -8z" fill="var(--pink)"/></svg>' +
        "<p>" + (selectedDate ? "이 날짜엔 기록이 없어요." : "이 달엔 아직 기록이 없어요.<br>카테고리를 선택해 지출을 추가해볼까요?") + "</p>";
      entriesWrap.appendChild(empty);
      return;
    }

    var groups = {};
    var order = [];
    filtered.forEach(function(e){
      if(!groups[e.date]){ groups[e.date] = []; order.push(e.date); }
      groups[e.date].push(e);
    });

    order.forEach(function(date){
      var groupDiv = document.createElement("div");
      groupDiv.className = "day-group";
      var dayLabel = document.createElement("button");
      dayLabel.type = "button";
      dayLabel.className = "day-label" + (selectedDate === date ? " picked" : "");
      var dNum = parseInt(date.split("-")[2],10);
      dayLabel.textContent = dNum + "일 보기";
      dayLabel.addEventListener("click", function(){
        selectedDate = (selectedDate === date) ? null : date;
        renderAll();
      });
      groupDiv.appendChild(dayLabel);

      groups[date].forEach(function(e){
        var c = CATS[e.category] || CATS.seol;
        var row = document.createElement("div");
        row.className = "entry";

        var chip = document.createElement("div");
        chip.className = "chip";
        chip.style.setProperty("--chip-accent", c.accent);
        row.appendChild(chip);

        if(editingEntryId === e.id){
          var editFields = document.createElement("div");
          editFields.className = "entry-edit-fields";

          var memoInput = document.createElement("input");
          memoInput.type = "text";
          memoInput.className = "entry-memo-input";
          memoInput.value = e.memo;
          memoInput.maxLength = 60;
          editFields.appendChild(memoInput);

          var catLabel = document.createElement("div");
          catLabel.className = "cat";
          catLabel.textContent = c.label;
          editFields.appendChild(catLabel);

          row.appendChild(editFields);

          var actions = document.createElement("div");
          actions.className = "entry-edit-actions";

          var amtInput = document.createElement("input");
          amtInput.type = "number";
          amtInput.className = "fr-amt-input";
          amtInput.value = e.amount;
          amtInput.min = "0";
          actions.appendChild(amtInput);

          var saveBtn = document.createElement("button");
          saveBtn.type = "button";
          saveBtn.className = "del save";
          saveBtn.textContent = "✓";
          function commitEntryEdit(){
            var mv = memoInput.value.trim();
            var v = parseFloat(amtInput.value);
            if(mv && v && v > 0) saveEntryItem(e.id, mv, v);
          }
          saveBtn.addEventListener("click", commitEntryEdit);
          actions.appendChild(saveBtn);

          [memoInput, amtInput].forEach(function(el){
            el.addEventListener("keydown", function(ev){
              if(ev.key === "Enter"){ ev.preventDefault(); commitEntryEdit(); }
            });
          });

          var cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "del";
          cancelBtn.textContent = "✕";
          cancelBtn.addEventListener("click", function(){
            editingEntryId = null;
            renderAll();
          });
          actions.appendChild(cancelBtn);

          row.appendChild(actions);
        }else{
          var info = document.createElement("div");
          info.className = "info";
          var memoDiv = document.createElement("div");
          memoDiv.className = "memo";
          memoDiv.textContent = e.memo;
          var catDiv = document.createElement("div");
          catDiv.className = "cat";
          catDiv.textContent = c.label;
          info.appendChild(memoDiv);
          info.appendChild(catDiv);
          row.appendChild(info);

          var amtDiv = document.createElement("div");
          amtDiv.className = "amt";
          amtDiv.textContent = fmtWon(e.amount);
          row.appendChild(amtDiv);

          var editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "del";
          editBtn.setAttribute("aria-label","항목 수정");
          editBtn.textContent = "✎";
          editBtn.addEventListener("click", function(){
            editingEntryId = e.id;
            renderAll();
          });
          row.appendChild(editBtn);

          var delBtn = document.createElement("button");
          delBtn.className = "del";
          delBtn.setAttribute("aria-label","삭제");
          delBtn.textContent = "✕";
          var confirming = false;
          var revertTimer = null;
          delBtn.addEventListener("click", function(){
            if(!confirming){
              confirming = true;
              delBtn.classList.add("confirm");
              delBtn.textContent = "삭제";
              revertTimer = setTimeout(function(){
                confirming = false;
                delBtn.classList.remove("confirm");
                delBtn.textContent = "✕";
              }, 2500);
            }else{
              clearTimeout(revertTimer);
              deleteEntry(e.id);
            }
          });
          row.appendChild(delBtn);
        }

        groupDiv.appendChild(row);
      });

      entriesWrap.appendChild(groupDiv);
    });
  }

  tryStoredUnlock();
})();
</script>
</body>
</html>
